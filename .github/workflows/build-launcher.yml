name: build-launcher

# 构建「启动.exe」：PyInstaller 只用于**构建期**，程序运行时依旧零第三方依赖。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要挂到哪个 Release（如 v0.8.24；留空则只出 Artifact）'
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 PyInstaller（仅构建期）
        run: pip install --disable-pip-version-check pyinstaller
      - name: 构建启动器
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name launcher tools/launcher.py
          if (-not (Test-Path 'dist/launcher.exe')) { throw '构建产物不存在' }
          Copy-Item 'dist/launcher.exe' 'dist/启动.exe' -Force
          Copy-Item 'dist/launcher.exe' 'dist/EVE-Launcher.exe' -Force
          Get-Item 'dist/启动.exe' | Select-Object Name, Length
        shell: pwsh
      - name: 冒烟测试（启动器能起来且能连上服务）
        run: |
          # 用一个最小的假 app 目录验证启动器逻辑（真实程序需要 runtime）
          New-Item -ItemType Directory -Force -Path smoke/app | Out-Null
          Copy-Item 'dist/启动.exe' 'smoke/启动.exe' -Force
          Set-Content -Encoding utf8 'smoke/app/main.py' 'import sys, http.server, threading, time'
          Add-Content -Encoding utf8 'smoke/app/main.py' 's = http.server.HTTPServer(("127.0.0.1", 8420), http.server.SimpleHTTPRequestHandler)'
          Add-Content -Encoding utf8 'smoke/app/main.py' 's.serve_forever()'
          Get-Process python,pythonw -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          # 注意：PowerShell 7 的 Start-Process -Wait 会等待**整个进程树**；
          # 启动器按设计 detached 拉起长期运行的服务 → -Wait 永不返回（CI 卡过 3 次）。
          # 所以这里不等待，改为轮询 HTTP 判断服务是否起来。
          Start-Process -FilePath 'smoke/启动.exe'
          Start-Sleep -Seconds 6
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8420/' -TimeoutSec 5
              Write-Host ("冒烟：HTTP " + $r.StatusCode + "（第 " + ($i+1) + " 次尝试）")
              $ok = $true; break
            } catch { Start-Sleep -Seconds 3 }
          }
          if (-not $ok) { throw "启动器没有把服务带起来（轮询 20 次仍失败）" }
          Get-Content 'smoke/logs/launcher.log' -ErrorAction SilentlyContinue
          Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: 启动.exe
          path: |
            dist/EVE-Launcher.exe
            dist/启动.exe
      - name: 挂到 Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            dist/EVE-Launcher.exe
            dist/启动.exe
