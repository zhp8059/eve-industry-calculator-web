<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 服务端会把这个占位符换成真实版本号；app.js 用它和 /api/status 的版本比对，
     不一致就提示「页面是旧版本，请 Ctrl+F5」—— 避免浏览器还跑着旧 app.js 时的困惑 -->
<meta name="app-version" content="__APP_VERSION__">
<title>EVE 工业计算器 · 欧服</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1220'/%3E%3Cpath d='M16 5l9 5.5v11L16 27l-9-5.5v-11z' fill='none' stroke='%233ddc84' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%235aa9ff'/%3E%3C/svg%3E">
</head>
<body>
<div id="boot" class="boot"><div class="boot-inner">正在加载…</div></div>

<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 3.5l10.5 6.2v12.6L16 28.5 5.5 22.3V9.7z" fill="none" stroke="#3ddc84" stroke-width="1.8"/>
      <circle cx="16" cy="16" r="3.6" fill="#5aa9ff"/>
      <path d="M16 3.5v6.9M27.5 9.7l-6 3.4M26.5 22.3l-6.9-2.7M16 28.5v-7.4M4.5 22.3l6.9-2.7M4.5 9.7l6 3.4"
            stroke="#3ddc84" stroke-width="1.1" opacity=".65"/>
    </svg>
    <div class="brand-text">
      <strong>EVE 工业计算器</strong>
      <span>欧服 Tranquility · 本地版</span>
    </div>
  </div>

  <nav id="nav" class="nav"></nav>

  <div class="topbar-right">
    <span id="sdeChip" class="chip chip-warn" title="静态数据状态">SDE</span>
    <button id="priceBtn" class="btn btn-sm" data-action="price-open"
            title="刷新并保存 ESI 市场物价">物价 ↻</button>
    <span id="charChip" class="chip" title="当前角色">未登录</span>
    <select id="charSelect" class="char-select" title="切换角色"></select>
    <button id="loginBtn" class="btn btn-sm btn-green" title="前往 EVE 官方页面授权你的角色">登录 EVE</button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<div class="shell">
  <aside class="sidebar">
    <div class="side-tabs">
      <button class="side-tab active" data-side="all">所有物品</button>
      <button class="side-tab" data-side="plan">已选产品</button>
    </div>

    <div id="sideAll" class="side-body">
      <div class="search-row">
        <input id="itemSearch" type="search" placeholder="输入物品名称（支持中文/英文）" autocomplete="off">
        <button id="itemSearchBtn" class="btn btn-sm" title="搜索">搜索</button>
      </div>
      <div class="hint hint-tiny">留空则按分类浏览；点击结果即可加入生产计划。</div>
      <div id="searchResults" class="list-scroll"></div>
      <div id="categoryTree" class="list-scroll"></div>
    </div>

    <div id="sidePlan" class="side-body" style="display:none">
      <div class="hint hint-tiny">生产计划中的产品。可在右侧修改 ME/TE/数量。</div>
      <div id="planList" class="list-scroll"></div>
      <div class="side-actions">
        <button class="btn btn-block" data-action="plan-save">保存计划</button>
        <button class="btn btn-ghost btn-block" data-action="plan-clear">清空计划</button>
      </div>
    </div>
  </aside>

  <main id="main" class="main">
    <div class="empty">正在初始化…</div>
  </main>
</div>

<div id="toasts" class="toasts"></div>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box">
    <div class="modal-head"><span id="modalTitle"></span>
      <button class="btn btn-ghost btn-sm" data-action="modal-close" title="关闭（Esc）">关闭</button></div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
